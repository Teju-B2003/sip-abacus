<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8590C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SIP Abacus Yelahanka</title>
<style>
:root{--bg:#F3F4F5;--surface:#fff;--ink:#16191C;--muted:#5E666D;--line:#D8DCE0;--accent:#E8590C;--accent-ink:#fff;--bad:#B0301C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1113;--surface:#1A1D20;--ink:#EDEFF1;--muted:#98A0A7;--line:#2C3136;--accent:#FF7A2E;--accent-ink:#1B0D03;--bad:#FF917B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;align-items:stretch;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.logo{display:block;margin:0 auto;height:72px;width:auto;max-width:100%;background:#fff;border-radius:10px;padding:4px 10px}
h1{margin:0;text-align:center;font-size:1.3rem;letter-spacing:-.01em}
p{margin:0;text-align:center;color:var(--muted);font-size:.92rem}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pw{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:1rem;text-transform:none;letter-spacing:normal}
button{font:inherit;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:600;cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.6;cursor:wait}
.keep{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.keep input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.err{min-height:1.2em;color:var(--bad);font-weight:600;font-size:.92rem;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

var $=function(i){return document.getElementById(i)};
function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function toB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function show(html){document.open();document.write(html);document.close()}
function decryptWith(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct)).then(function(pt){return new TextDecoder().decode(pt)})}
function deriveKey(pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  });
}
if(!(window.crypto&&crypto.subtle)){$('err').textContent='This page must be opened from a secure (https) address.';$('go').disabled=true;return}
/* saved sign-in on this device */
try{
  var saved=localStorage.getItem('sip-key');
  if(saved){
    document.body.style.visibility='hidden';
    var auto=function(){crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']).then(decryptWith).then(show).catch(function(){try{localStorage.removeItem('sip-key')}catch(e){}document.body.style.visibility=''})};
    if(document.readyState==='complete') auto(); else window.addEventListener('load',auto);
  }
}catch(e){}
$('eye').addEventListener('click',function(){var p=$('pw'),t=p.type==='password';p.type=t?'text':'password';this.textContent=t?'Hide':'Show'});
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  var pw=$('pw').value;if(!pw) return;
  $('go').disabled=true;$('err').textContent='';
  deriveKey(pw).then(function(key){
    return decryptWith(key).then(function(html){
      if($('keep').checked){
        return crypto.subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem('sip-key',toB64(raw))}catch(e){}return html});
      }
      return html;
    });
  }).then(show).catch(function(){
    $('go').disabled=false;$('err').textContent='Wrong password. Try again.';$('pw').select();
  });
});
$('pw').focus();
})();
