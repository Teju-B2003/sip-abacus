<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#E8590C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIP Abacus Yelahanka</title>
<style>
/* Layout: one centered column. Title bar, mode tabs, big number, the abacus, then a single row of actions. Settings stay folded away until asked for. */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --ink:#16191C; --muted:#5E666D; --line:#D8DCE0;
  --accent:#E8590C; --accent-ink:#FFFFFF; --tint:#FDEBDD;
  --good:#17703A; --good-bg:#E3F4EA; --bad:#B0301C; --bad-bg:#FBE8E4;
  --bead-hi:#FF9B4E; --bead:#F26A12; --bead-lo:#B0420A;
  --frame:#17181A; --frame-in:#0C0D0E; --silver:#D9DCE0; --frame-ink:#C9CDD2; --bar:#050505;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1113; --surface:#1A1D20; --ink:#EDEFF1; --muted:#98A0A7; --line:#2C3136;
    --accent:#FF7A2E; --accent-ink:#1B0D03; --tint:#3A2314;
    --good:#62D38E; --good-bg:#14301F; --bad:#FF917B; --bad-bg:#3A1A14;
    --frame:#1F2124; --frame-in:#0C0D0E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#1A1D20; --ink:#EDEFF1; --muted:#98A0A7; --line:#2C3136;
  --accent:#FF7A2E; --accent-ink:#1B0D03; --tint:#3A2314;
  --good:#62D38E; --good-bg:#14301F; --bad:#FF917B; --bad-bg:#3A1A14;
  --frame:#1F2124; --frame-in:#0C0D0E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-block:18px 36px;padding-inline:16px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.head > div{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4vw,1.9rem);letter-spacing:-.02em;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.tools{display:flex;gap:8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.bt{min-width:0}
.logo{display:block;height:clamp(46px,9vw,66px);width:auto;max-width:100%;background:#fff;border-radius:10px;padding:4px 8px}

.btn{min-height:44px;padding:8px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn[aria-expanded="true"]{background:var(--tint);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.glabel{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;min-height:38px;min-width:40px;padding:6px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:38px;cursor:pointer;font-weight:500}
.sw input{width:18px;height:18px;margin:0;accent-color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.prompt{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 24px;flex-wrap:wrap}
.prompt > div{min-width:0}
.prompt .big{font-family:var(--mono);font-weight:700;font-size:clamp(1.7rem,6vw,3rem);font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.prompt .note{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.score{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.glabel.p{margin:0}

.readout{text-align:center;padding:4px 0}
.num{display:inline-block;max-width:100%;font-family:var(--mono);font-weight:700;font-size:clamp(2.2rem,8vw,4.6rem);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;padding:2px 18px;border-radius:12px;border:2px solid transparent;transition:background .15s,border-color .15s}
.num.masked{color:var(--muted);letter-spacing:.25em}
.num.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.num.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cap{margin:2px 0 0;color:var(--muted);font-size:.85rem}

/* Soroban */
.stage{--bh:clamp(22px,min(4.4vw,5.6vh),40px)}
.frame{background:linear-gradient(180deg,#2A2C2F,var(--frame) 30%,var(--frame));border-radius:16px;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.board{background:var(--frame-in);border-radius:8px;padding:8px 6px 6px;overflow-x:auto;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.rods{display:flex;min-width:min-content}
.rod{flex:1 0 38px;min-width:0;display:flex;flex-direction:column}
.pdigit{height:1.3rem;text-align:center;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--silver);visibility:hidden}
.show-values .pdigit{visibility:visible}
.deck{position:relative}
.deck.up{height:calc(var(--bh)*2)}
.deck.low{height:calc(var(--bh)*5)}
.deck::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:linear-gradient(90deg,#7C8087,#F1F3F5 50%,#7C8087);border-radius:2px}
.bar{height:calc(var(--bh)*.5);background:linear-gradient(180deg,#1B1C1E,var(--bar));position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.bar i{width:7px;height:7px;border-radius:50%;background:var(--silver);display:block}
.bar i.unit{width:11px;height:11px;background:var(--bead)}
.plabel.unit{color:var(--bead-hi);font-weight:700}
.bead{--bw:min(calc(100% - 3px),calc(var(--bh)*2.3));position:absolute;top:0;left:50%;width:var(--bw);margin-left:calc(var(--bw)/-2);height:var(--bh);padding:0;border:0;background:none;cursor:pointer;
  transform:translateY(calc(var(--bh)*var(--k,0)));transition:transform .17s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.55));touch-action:manipulation;z-index:2}
.bead span{position:absolute;inset:2px 0;clip-path:polygon(0 50%,16% 14%,50% 3%,84% 14%,100% 50%,84% 86%,50% 97%,16% 86%);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.45),transparent 58%),linear-gradient(180deg,var(--bead-hi),var(--bead) 48%,var(--bead-lo));transition:filter .1s}
.bead:hover span{filter:brightness(1.1)}
.bead:active span{filter:brightness(.92)}
.bead b{font-family:var(--mono);font-size:calc(var(--bh)*.38);color:rgba(0,0,0,.65);display:none}
.show-values .bead b{display:block}
.plabel{padding-top:6px;text-align:center;font-family:var(--mono);font-size:clamp(.58rem,1.5vw,.78rem);color:var(--frame-ink);white-space:nowrap;letter-spacing:-.05em}
.instant .bead{transition:none}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.setform{display:flex;gap:8px;align-items:center}
.setform input{min-height:44px;width:10.5rem;max-width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--mono);font-weight:500}
select{min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600}
.status{min-height:1.4em;margin:0;text-align:center;color:var(--muted);font-size:.95rem}
.status.good{color:var(--good);font-weight:600}
.status.bad{color:var(--bad);font-weight:600}

body.focus h1,body.focus .sub,body.focus .tabs,body.focus .prompt,body.focus .actions,body.focus .status{display:none!important}
body.focus .head{justify-content:space-between}
.exit{display:none}
body.present .settings,body.present .tabs,body.present .bt,body.present #btnSettings,body.present #btnPresent{display:none}
body.present .stage{--bh:clamp(26px,min(6vw,8.2vh),64px)}
body.present .wrap{max-width:1400px}
body.present .exit{display:inline-flex}
@media (prefers-reduced-motion:reduce){.bead,.num,.btn{transition:none}}
@media (max-width:520px){.setform{width:100%}.setform input{flex:1}}
</style>

      <option value="3">3 digits</option>
      <option value="4">4 digits</option>
    </select>
    <button type="button" class="btn" id="btnShow">Show answer</button>
    <button type="button" class="btn" id="btnNew">New problem</button>
    <button type="button" class="btn primary" id="btnCheck">Check</button>
  </section>

  <p class="status" id="status" aria-live="polite"></p>
</div>

<script>
(function(){
  var ROD_CHOICES=[5,7,9,11,13];
  var state={rods:innerWidth<520?7:(innerWidth>=900?13:9),grouping:'in',values:false,hide:false,sound:false,mode:'explore',type:'make',digits:2,
    d:[],ch:null,score:{ok:0,n:0,streak:0},hist:[],dec:null,auto:true};
  var refs=[];
  var $=function(s){return document.querySelector(s)};
  var rodsEl=$('#rods'),stage=$('#stage');

  try{
    var saved=JSON.parse(localStorage.getItem('soroban-prefs')||'{}');
    if(ROD_CHOICES.indexOf(saved.rods)>-1) state.rods=saved.rods;
    if(saved.grouping==='in'||saved.grouping==='intl') state.grouping=saved.grouping;
    state.values=!!saved.values; state.sound=!!saved.sound;
    if(typeof saved.dec==='number'&&saved.dec>=0&&saved.dec<=6){state.dec=saved.dec;state.auto=false}
  }catch(e){}
  function savePrefs(){try{localStorage.setItem('soroban-prefs',JSON.stringify({rods:state.rods,grouping:state.grouping,values:state.values,sound:state.sound,dec:state.auto?null:state.dec}))}catch(e){}}
  function defDec(r){return Math.floor(r/2)}
  if(state.dec==null) state.dec=defDec(state.rods);
  state.dec=Math.min(state.dec,state.rods-1);

  function pow(p){return Math.pow(10,p)}
  function fmt(n){return new Intl.NumberFormat(state.grouping==='in'?'en-IN':'en-US').format(n)}
  function maxVal(){return pow(state.rods-state.dec)-1}
  function scaled(){var v=0;for(var p=0;p<state.rods;p++)v+=state.d[p]*pow(p);return v}
  function value(){return Math.floor(scaled()/pow(state.dec))}
  function text(){
    var sc=scaled(),ip=Math.floor(sc/pow(state.dec)),fp=sc%pow(state.dec),t=fmt(ip);
    if(fp){var f=String(fp);while(f.length<state.dec) f='0'+f;t+='.'+f.replace(/0+$/,'')}
    return t;
  }
  function rng(a,b){return a+Math.floor(Math.random()*(b-a+1))}

  function placeLabel(p){
    if(p<state.dec) return '.'+new Array(state.dec-p).join('0')+'1';
    p=p-state.dec;
    if(p<3) return String(pow(p));
    if(state.grouping==='intl'){var u=['K','M','B','T'];return pow(p%3)+u[Math.floor(p/3)-1]}
    if(p<5) return pow(p-3)+'K';
    if(p<7) return pow(p-5)+'L';
    var n=pow(p-7);
    if(n<1000) return n+' Cr';
    if(n<100000) return (n/1000)+'K Cr';
    return (n/100000)+'L Cr';
  }

  var ac;
  function tick(){
    if(!state.sound) return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var len=Math.floor(ac.sampleRate*0.035),buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
      for(var i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      var s=ac.createBufferSource();s.buffer=buf;
      var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=1.2;
      var g=ac.createGain();g.gain.value=.5;
      s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
    }catch(e){}
  }

  /* undo history */
  function snap(){state.hist.push(state.d.slice());if(state.hist.length>60) state.hist.shift();$('#btnUndo').disabled=false}
  function clearHist(){state.hist=[];$('#btnUndo').disabled=true}
  $('#btnUndo').addEventListener('click',function(){
    if(!state.hist.length) return;
    state.d=state.hist.pop();$('#btnUndo').disabled=!state.hist.length;
    render();tick();markNeutral();
  });

  function build(){
    rodsEl.textContent='';refs=[];
    for(var p=state.rods-1;p>=0;p--){
      var lab=placeLabel(p),rod=document.createElement('div');
      rod.className='rod';
      var low='';
      for(var i=1;i<=4;i++) low+='<button type="button" class="bead" data-p="'+p+'" data-t="'+i+'" aria-pressed="false" aria-label="Earth bead '+i+', rod '+lab+', worth 1"><span><b>1</b></span></button>';
      rod.innerHTML='<div class="pdigit" aria-hidden="true">0</div>'+
        '<div class="deck up"><button type="button" class="bead heaven" data-p="'+p+'" data-t="u" aria-pressed="false" aria-label="Heaven bead, rod '+lab+', worth 5"><span><b>5</b></span></button></div>'+
        '<div class="bar">'+(p===state.dec?'<i class="unit"></i>':((p>state.dec&&(p-state.dec)%3===0)?'<i></i>':''))+'</div>'+
        '<div class="deck low">'+low+'</div>'+
        '<div class="plabel'+(p===state.dec?' unit':'')+'">'+lab+'</div>';
      rodsEl.appendChild(rod);
      refs[p]={pd:rod.querySelector('.pdigit'),u:rod.querySelector('.heaven'),l:[].slice.call(rod.querySelectorAll('.deck.low .bead'))};
    }
    stage.classList.add('instant');
    render();
    requestAnimationFrame(function(){requestAnimationFrame(function(){stage.classList.remove('instant')})});
  }
  function render(){
    for(var p=0;p<state.rods;p++){
      var d=state.d[p],up=d>=5,low=d%5,r=refs[p];
      r.u.style.setProperty('--k',up?1:0);
      r.u.setAttribute('aria-pressed',up);
      for(var i=1;i<=4;i++){
        var on=low>=i;
        r.l[i-1].style.setProperty('--k',on?(i-1):i);
        r.l[i-1].setAttribute('aria-pressed',on);
      }
      r.pd.textContent=d;
    }
    readout();
  }
  function readout(){
    var num=$('#num'),show=state.mode==='explore'?!state.hide:(state.ch&&state.ch.revealed);
    num.textContent=show?text():'• • • •';
    num.classList.toggle('masked',!show);
  }
  function markNeutral(){
    var n=$('#num');n.classList.remove('ok','no');
    if(state.ch&&!state.ch.revealed) setStatus('','');
  }
  function setScaled(s){
    s=Math.max(0,Math.floor(s)||0);
    var capped=s>pow(state.rods)-1;if(capped)s=pow(state.rods)-1;
    for(var p=0;p<state.rods;p++) state.d[p]=Math.floor(s/pow(p))%10;
    render();
    return !capped;
  }
  function setNumber(n){return setScaled(Math.max(0,Math.floor(n)||0)*pow(state.dec))}
  function setStatus(cls,msg){var f=$('#status');f.className='status '+cls;f.textContent=msg}

  rodsEl.addEventListener('click',function(e){
    var b=e.target.closest('.bead');if(!b) return;
    var p=+b.dataset.p,t=b.dataset.t,d=state.d[p],up=d>=5?1:0,low=d%5;
    snap();
    if(t==='u') up=up?0:1; else {var i=+t;low=low>=i?i-1:i}
    state.d[p]=up*5+low;
    render();tick();markNeutral();
  });

  /* settings */
  function pressed(seg,val){[].forEach.call(seg.querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.v===String(val)))})}
  function buildRodSeg(){
    var seg=$('#segRods');seg.textContent='';
    ROD_CHOICES.forEach(function(n){var b=document.createElement('button');b.type='button';b.dataset.v=n;b.textContent=n;b.setAttribute('aria-pressed',String(n===state.rods));seg.appendChild(b)});
    var sd=$('#segDec');sd.textContent='';
    [0,1,2,3,4,5,6].forEach(function(n){if(n>=state.rods) return;var b=document.createElement('button');b.type='button';b.dataset.v=n;b.textContent=n;b.setAttribute('aria-pressed',String(n===state.dec));sd.appendChild(b)});
  }
  $('#btnSettings').addEventListener('click',function(){
    var s=$('#settings'),open=s.hidden;s.hidden=!open;this.setAttribute('aria-expanded',String(open));document.body.classList.toggle('focus',!open);
  });
  $('#segRods').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    var keep=value();state.rods=+b.dataset.v;pressed($('#segRods'),state.rods);if(state.auto) state.dec=defDec(state.rods);state.dec=Math.min(state.dec,state.rods-1);buildRodSeg();
    state.d=[];for(var p=0;p<state.rods;p++) state.d[p]=0;
    clearHist();build();setNumber(keep%pow(state.rods-state.dec));savePrefs();
    if(state.mode==='challenge') newProblem();
  });
  $('#segGroup').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    state.grouping=b.dataset.v;pressed($('#segGroup'),state.grouping);
    build();savePrefs();if(state.mode==='challenge') showPrompt();
  });
  $('#segDec').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    var keep=value();state.dec=Math.min(+b.dataset.v,state.rods-1);state.auto=false;pressed($('#segDec'),state.dec);
    state.d=[];for(var p=0;p<state.rods;p++) state.d[p]=0;
    clearHist();build();setNumber(keep%pow(state.rods-state.dec));savePrefs();
    if(state.mode==='challenge') newProblem();
  });
  $('#optValues').addEventListener('change',function(e){state.values=e.target.checked;stage.classList.toggle('show-values',state.values);savePrefs()});
  $('#optHide').addEventListener('change',function(e){state.hide=e.target.checked;readout()});
  $('#optSound').addEventListener('change',function(e){state.sound=e.target.checked;savePrefs();tick()});

  /* explore actions */
  $('#btnClearTop').addEventListener('click',function(){snap();setNumber(state.ch?state.ch.start:0);$('#num').classList.remove('ok','no');if(!state.ch||!state.ch.revealed) setStatus('','')});
  $('#btnRandom').addEventListener('click',function(){
    snap();var digits=Math.max(1,Math.min(state.rods-state.dec,5));setNumber(rng(pow(digits-1),pow(digits)-1));setStatus('','');
  });
  $('#setForm').addEventListener('submit',function(e){
    e.preventDefault();
    var raw=$('#setNum').value.replace(/[,\s]/g,'');
    if(!/^(\d+\.?\d*|\.\d+)$/.test(raw)){setStatus('bad','Type a number, then press Set.');return}
    snap();var ok=setScaled(Math.round(parseFloat(raw)*pow(state.dec)));
    setStatus(ok?'':'bad',ok?'':state.rods+' rods hold up to '+fmt(maxVal())+'. Showing that limit.');
  });

  /* practice */
  function range(d){return [d===1?1:pow(d-1),pow(d)-1]}
  function newProblem(){
    var d=Math.max(1,Math.min(state.digits,state.rods-state.dec-1)),r=range(d),ch={type:state.type,revealed:false,scored:false};
    if(state.type==='make'){ch.answer=rng(r[0],r[1]);ch.start=0}
    else{
      var a=rng(r[0],r[1]),b=rng(r[0],r[1]);
      if(state.type==='sub'){var t=0;while(a===b&&t++<20) b=rng(r[0],r[1]);if(b>a){var x=a;a=b;b=x}if(a===b&&a>1) b=a-1}
      ch.a=a;ch.b=b;ch.start=a;ch.answer=state.type==='add'?a+b:a-b;
    }
    state.ch=ch;clearHist();setNumber(ch.start);showPrompt();setStatus('','');updateScore();
    $('#num').classList.remove('ok','no');readout();
  }
  function showPrompt(){
    var ch=state.ch;if(!ch) return;
    var L=$('#promptLabel'),B=$('#promptBig'),N=$('#promptNote');
    if(ch.type==='make'){L.textContent='Make this number';B.textContent=fmt(ch.answer);N.textContent='Start from an empty abacus.'}
    else{
      L.textContent=ch.type==='add'?'Add':'Subtract';
      B.textContent=fmt(ch.a)+(ch.type==='add'?' + ':' − ')+fmt(ch.b);
      N.textContent='The abacus starts at '+fmt(ch.a)+'. Show the answer on the beads.';
    }
  }
  function updateScore(){var s=state.score;$('#score').textContent=s.n?(s.ok+' of '+s.n+' correct · streak '+s.streak):''}
  function score(right){
    var ch=state.ch;if(ch.scored) return;
    ch.scored=true;state.score.n++;
    if(right){state.score.ok++;state.score.streak++}else state.score.streak=0;
    updateScore();
  }
  $('#btnNew').addEventListener('click',newProblem);
  $('#btnShow').addEventListener('click',function(){
    var ch=state.ch;if(!ch) return;
    ch.revealed=true;score(false);
    $('#num').classList.remove('ok','no');
    setNumber(ch.answer);setStatus('','Answer: '+fmt(ch.answer));
  });
  $('#btnCheck').addEventListener('click',function(){
    var ch=state.ch;if(!ch) return;
    var right=scaled()===ch.answer*pow(state.dec),n=$('#num');
    ch.revealed=true;score(right);readout();
    n.classList.toggle('ok',right);n.classList.toggle('no',!right);
    setStatus(right?'good':'bad',right?'Correct':'Not yet. Adjust the beads and check again.');
  });
  $('#selType').addEventListener('change',function(e){state.type=e.target.value;newProblem()});
  $('#selDigits').addEventListener('change',function(e){state.digits=+e.target.value;newProblem()});

  function setMode(m){
    state.mode=m;pressed($('#segMode'),m);
    $('#actExplore').hidden=m!=='explore';
    $('#actChallenge').hidden=m!=='challenge';
    $('#promptCard').hidden=m!=='challenge';
    $('#optHide').disabled=m==='challenge';
    setStatus('','');$('#num').classList.remove('ok','no');
    if(m==='challenge'){newProblem()}else{state.ch=null;clearHist();readout()}
  }
  $('#segMode').addEventListener('click',function(e){var b=e.target.closest('button');if(b) setMode(b.dataset.v)});

  function present(on){
    document.body.classList.toggle('present',on);
    try{
      if(on&&document.documentElement.requestFullscreen){var pr=document.documentElement.requestFullscreen();if(pr&&pr.catch) pr.catch(function(){})}
      else if(!on&&document.fullscreenElement&&document.exitFullscreen){var q=document.exitFullscreen();if(q&&q.catch) q.catch(function(){})}
    }catch(e){}
  }
  $('#btnPresent').addEventListener('click',function(){present(true)});
  $('#btnExit').addEventListener('click',function(){present(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('present')) present(false)});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement) document.body.classList.remove('present')});

  buildRodSeg();pressed($('#segGroup'),state.grouping);
  $('#optValues').checked=state.values;$('#optSound').checked=state.sound;
  stage.classList.toggle('show-values',state.values);
  for(var p=0;p<state.rods;p++) state.d[p]=0;
  build();setNumber(48275);
})();
</script>
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
